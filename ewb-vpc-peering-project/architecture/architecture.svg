<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
<title id="title">AWS VPC Peering conceptual architecture</title><desc id="desc">Laptop connects to a public bastion in VPC A. Private App-A and App-B communicate through VPC Peering.</desc>
